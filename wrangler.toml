name = "hyperdrive"
main = "build/index.js"

[[hyperdrive]]
binding = "saas-hyper"
id = "9c62b26596e246f9951b894ec23bba76"

[build]
command = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && . \"$HOME/.cargo/env\" && rustup target add wasm32-unknown-unknown && cargo install \"worker-build@^0.8\" && worker-build --release"
